<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña | EduConta SV</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Tailwind CSS Local -->
    <script src="js/core/tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    colors: {
                        slate: {
                            650: '#3e4b5c',
                            750: '#293548',
                            850: '#172033',
                            950: '#0f172a',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                        mono: ['JetBrains Mono', 'Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="css/output.css" rel="stylesheet">


    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/modales.css?v=1.3.1">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/core/theme.js"></script>
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- PRELOADER CORPORATIVO EDUCONTA -->
    <div id="global-preloader" class="theme-sky" role="status" aria-live="polite" aria-label="Cargando">
        <div class="bg-volumetrico" aria-hidden="true">
            <canvas id="volGL"></canvas>
            <div class="vol-blob b1"></div>
            <div class="vol-blob b2"></div>
            <div class="vol-blob b3"></div>
            <div class="vol-blob b4"></div>
            <div class="vol-blob b5"></div>
            <div class="vol-sheen"></div>
            <div class="vol-glass"></div>
            <div class="vol-glass pulse"></div>
            <div class="vol-veil"></div>
        </div>
        <div class="loader-container">
            <div class="logo-wrap glow">
                <!-- Grafica de Barras (Arriba en loop) -->
                <svg class="icon-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="glowGPre" x="-400%" y="-100%" width="900%" height="300%" color-interpolation-filters="sRGB">
                            <feDropShadow class="fx" dx="0" dy="0" stdDeviation="1" style="flood-color:var(--gc)" result="a"/>
                            <feDropShadow class="fx" in="a" dx="0" dy="0" stdDeviation="3" style="flood-color:var(--gc)"/>
                        </filter>
                    </defs>
                    <rect class="bar bar-1" x="28.5" y="55" width="11" height="16" rx="1" fill="var(--b1)"/>
                    <rect class="bar bar-2" x="44.5" y="42" width="11" height="29" rx="1" fill="var(--b2)"/>
                    <g class="glow-g"><rect class="bar bar-3" x="60.5" y="27" width="11" height="44" rx="1" fill="var(--celeste-sv)"/></g>
                    <rect class="base-line" x="20" y="70" width="60" height="5" rx="1" fill="var(--base)"/>
                </svg>

                <!-- Texto EduConta SV (Abajo, posicion exacta, sin animacion) -->
                <svg class="text-svg" viewBox="0 0 472 100" xmlns="http://www.w3.org/2000/svg">
                    <g font-family="'Plus Jakarta Sans', sans-serif" font-size="78">
                        <text x="0" y="75" font-weight="800" fill="var(--azul-corporativo)">E</text>
                        <text x="44.44" y="75" font-weight="800" fill="var(--azul-corporativo)">d</text>
                        <text x="95.44" y="75" font-weight="800" fill="var(--azul-corporativo)">u</text>
                        <text x="140.66" y="75" font-weight="300" fill="var(--azul-corporativo)">C</text>
                        <text x="200.39" y="75" font-weight="300" fill="var(--azul-corporativo)">o</text>
                        <text x="250.29" y="75" font-weight="300" fill="var(--azul-corporativo)">n</text>
                        <text x="293.41" y="75" font-weight="300" fill="var(--azul-corporativo)">t</text>
                        <text x="321.86" y="75" font-weight="300" fill="var(--azul-corporativo)">a</text>
                        <g class="glow-g">
                            <text x="365.05" y="75" font-weight="800" fill="var(--celeste-sv)">S</text>
                            <text x="414.02" y="75" font-weight="800" fill="var(--celeste-sv)">V</text>
                        </g>
                    </g>
                </svg>
            </div>

            <div class="loading-text">Cargando entorno
                <div class="dots"><span>.</span><span>.</span><span>.</span></div>
            </div>
        </div>
    </div>
    <script src="js/core/preloader.js"></script>
    <main class="glass-modal w-full max-w-[420px] relative z-10" style="animation: modalPopIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
        
        <div class="mx-auto w-20 h-20 rounded-[36px] bg-white mb-8 flex items-center justify-center"
            style="box-shadow: -8px -8px 16px rgba(255,255,255,0.9), 8px 8px 16px rgba(15, 23, 42, 0.06); transform: translateY(-10px);">
            <i class="fas fa-lock text-3xl text-sky-500"></i>
        </div>

        <h4 class="text-2xl font-black text-slate-800 tracking-tight mb-2 text-center"
            style="text-shadow: 1px 1px 0px rgba(255,255,255,1);">Restablecer Contraseña</h4>
        <p class="text-xs text-slate-400 text-center font-bold uppercase tracking-widest mb-8">Escribe tu nueva clave de acceso</p>

        <!-- Zonas de Alerta -->
        <div id="reset-error-msg"
            class="hidden mb-6 p-4 bg-rose-50 border-none rounded-[36px] text-rose-600 text-xs font-bold shadow-[inset_2px_2px_5px_rgba(225,29,72,0.1)]">
        </div>
        <div id="reset-success-msg"
            class="hidden mb-6 p-4 bg-emerald-50 border-none rounded-[36px] text-emerald-600 text-xs font-bold text-center shadow-[inset_2px_2px_5px_rgba(16,185,129,0.1)]">
        </div>

        <!-- Formulario Principal -->
        <form id="form-reset-pwd" class="space-y-6">
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest block mb-1 px-2">Nueva Contraseña</label>
                <div class="relative">
                    <input type="password" id="reset-password-input" required minlength="6"
                        class="w-full bg-slate-50 border border-slate-200 rounded-[36px] px-5 py-3.5 text-sm text-slate-700 font-bold focus:border-sky-400 focus:bg-white outline-none transition-all pr-12"
                        placeholder="Mínimo 6 caracteres">
                    <button type="button"
                        onclick="toggleVisibility()"
                        class="absolute right-5 top-3.5 text-slate-400 hover:text-sky-500 transition-colors focus:outline-none">
                        <i id="reset-password-icon" class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mt-8 flex flex-col gap-4">
                <button type="submit" id="btn-reset-submit"
                    class="w-full px-6 py-4 rounded-[36px] bg-sky-500 text-white font-black text-[13px] uppercase tracking-wide transition-all shadow-lg shadow-sky-100 hover:bg-sky-600 focus:ring-4 focus:ring-sky-100/50 outline-none">
                    Guardar Contraseña
                </button>
                <button type="button" onclick="window.location.href='index.html'"
                    class="text-[11px] font-bold text-slate-500 hover:text-slate-800 transition-colors py-2 focus:outline-none">
                    Cancelar y volver al <span class="text-sky-500">Inicio</span>
                </button>
            </div>
        </form>
    </main>

    <!-- CORE DEPENDENCIES -->
    <script src="js/core/security.js"></script>
    <script defer src="js/core/supabase.js"></script>
    <script defer src="js/pages/reset-password.js"></script>
</body>

</html>
