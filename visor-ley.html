<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Leyes | EduConta SV</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="robots" content="noindex, nofollow">
    <!-- Tailwind CSS Local -->
    <script src="js/core/tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            corePlugins: { preflight: false },
            theme: {
                extend: {
                    colors: {
                        slate: {
                            650: '#3e4b5c',
                            750: '#293548',
                            850: '#172033',
                            950: '#0f172a',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                        mono: ['JetBrains Mono', 'Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="css/output.css" rel="stylesheet">


    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/modales.css?v=1.3.1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/core/theme.js"></script>
</head>
<body class="h-screen pt-[88px] w-full flex flex-col overflow-hidden bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 selection:bg-emerald-500/30">
    <!-- PRELOADER CORPORATIVO EDUCONTA -->
    <div id="global-preloader" class="theme-emerald" role="status" aria-live="polite" aria-label="Cargando">
        <div class="bg-volumetrico" aria-hidden="true">
            <canvas id="volGL"></canvas>
            <div class="vol-blob b1"></div>
            <div class="vol-blob b2"></div>
            <div class="vol-blob b3"></div>
            <div class="vol-blob b4"></div>
            <div class="vol-blob b5"></div>
            <div class="vol-sheen"></div>
            <div class="vol-glass"></div>
            <div class="vol-glass pulse"></div>
            <div class="vol-veil"></div>
        </div>
        <div class="loader-container">
            <div class="logo-wrap glow">
                <!-- Grafica de Barras (Arriba en loop) -->
                <svg class="icon-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="glowGPre" x="-400%" y="-100%" width="900%" height="300%" color-interpolation-filters="sRGB">
                            <feDropShadow class="fx" dx="0" dy="0" stdDeviation="1" style="flood-color:var(--gc)" result="a"/>
                            <feDropShadow class="fx" in="a" dx="0" dy="0" stdDeviation="3" style="flood-color:var(--gc)"/>
                        </filter>
                    </defs>
                    <rect class="bar bar-1" x="28.5" y="55" width="11" height="16" rx="1" fill="var(--b1)"/>
                    <rect class="bar bar-2" x="44.5" y="42" width="11" height="29" rx="1" fill="var(--b2)"/>
                    <g class="glow-g"><rect class="bar bar-3" x="60.5" y="27" width="11" height="44" rx="1" fill="var(--celeste-sv)"/></g>
                    <rect class="base-line" x="20" y="70" width="60" height="5" rx="1" fill="var(--base)"/>
                </svg>

                <!-- Texto EduConta SV (Abajo, posicion exacta, sin animacion) -->
                <svg class="text-svg" viewBox="0 0 472 100" xmlns="http://www.w3.org/2000/svg">
                    <g font-family="'Plus Jakarta Sans', sans-serif" font-size="78">
                        <text x="0" y="75" font-weight="800" fill="var(--azul-corporativo)">E</text>
                        <text x="44.44" y="75" font-weight="800" fill="var(--azul-corporativo)">d</text>
                        <text x="95.44" y="75" font-weight="800" fill="var(--azul-corporativo)">u</text>
                        <text x="140.66" y="75" font-weight="300" fill="var(--azul-corporativo)">C</text>
                        <text x="200.39" y="75" font-weight="300" fill="var(--azul-corporativo)">o</text>
                        <text x="250.29" y="75" font-weight="300" fill="var(--azul-corporativo)">n</text>
                        <text x="293.41" y="75" font-weight="300" fill="var(--azul-corporativo)">t</text>
                        <text x="321.86" y="75" font-weight="300" fill="var(--azul-corporativo)">a</text>
                        <g class="glow-g">
                            <text x="365.05" y="75" font-weight="800" fill="var(--celeste-sv)">S</text>
                            <text x="414.02" y="75" font-weight="800" fill="var(--celeste-sv)">V</text>
                        </g>
                    </g>
                </svg>
            </div>

            <div class="loading-text">Cargando entorno
                <div class="dots"><span>.</span><span>.</span><span>.</span></div>
            </div>
        </div>
    </div>
    <script src="js/core/preloader.js"></script>
    <header class="h-20 shrink-0 border-b border-white/40 dark:border-slate-800/60 px-6 md:px-8 flex items-center justify-between bg-white/70 dark:bg-slate-900/50 backdrop-blur-md shadow-sm z-20">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-400 to-emerald-600 text-white flex items-center justify-center text-xl shadow-[0_0_20px_rgba(16,185,129,0.4)]">
                <i class="fas fa-book-open"></i>
            </div>
            <div>
                <h3 id="reader-law-title" class="text-base md:text-xl font-black text-slate-900 dark:text-white leading-tight tracking-tight drop-shadow-sm">Cargando Ley...</h3>
                <p id="reader-law-subtitle" class="text-[10px] text-emerald-600 dark:text-emerald-400 font-extrabold uppercase tracking-widest mt-0.5">Biblioteca Legal • EduConta SV</p>
            </div>
        </div>
        
        <!-- Buscador y Acciones -->
        <div class="flex items-center gap-3 md:gap-4">
            <div class="relative w-48 md:w-80 hidden sm:block group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fas fa-search text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
                </div>
                <input type="text" id="reader-search-input" class="w-full bg-white/50 dark:bg-slate-950/50 border border-slate-200 dark:border-slate-800 rounded-full pl-11 pr-5 py-2.5 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 outline-none placeholder-slate-400 transition-all shadow-inner backdrop-blur-sm" placeholder="Buscar en la ley..." oninput="filterReaderArticles()">
            </div>
            
            <div class="flex items-center bg-slate-100 dark:bg-slate-800/60 p-1 rounded-full border border-slate-200 dark:border-slate-700/50">
                <button id="btn-toggle-view" onclick="toggleGridView()" class="w-8 h-8 flex items-center justify-center rounded-full bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 shadow-sm transition-all" title="Alternar Vista (Grid/Lista)">
                    <i class="fas fa-th-large" id="icon-toggle-view"></i>
                </button>
            </div>

            <button onclick="toggleSidebar()" class="lg:hidden w-10 h-10 flex items-center justify-center rounded-full bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-100 dark:hover:bg-emerald-900/50 transition-all border border-emerald-100 dark:border-emerald-800/50 shadow-sm" title="Mostrar/Ocultar Índice">
                <i class="fas fa-list-ul text-lg"></i>
            </button>

            <button onclick="window.close()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/50 dark:bg-slate-800/50 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-white transition-all border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md" title="Cerrar Pestaña">
                <i class="fas fa-times text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Buscador Móvil -->
    <div class="sm:hidden px-4 py-3 shrink-0 bg-white/50 dark:bg-slate-900/50 border-b border-slate-200/50 dark:border-slate-800/50 z-10">
        <div class="relative w-full group">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fas fa-search text-slate-400 group-focus-within:text-emerald-500 transition-colors"></i>
            </div>
            <input type="text" id="reader-search-input-mobile" class="w-full bg-white/80 dark:bg-slate-950/80 border border-slate-200 dark:border-slate-800 rounded-full pl-11 pr-5 py-2 text-sm text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 outline-none placeholder-slate-400 transition-all shadow-inner" placeholder="Buscar..." oninput="document.getElementById('reader-search-input').value=this.value; filterReaderArticles();">
        </div>
    </div>

    <!-- Cuerpo del Lector (Split View) -->
    <div class="flex-1 flex overflow-hidden relative">
        <!-- Sidebar del Lector (Índice de la Ley) -->
        <aside class="w-72 border-r border-slate-200/60 dark:border-slate-800/60 overflow-y-auto hidden lg:block select-none relative z-10" id="reader-sidebar">
            <div class="sticky top-0 p-5 flex items-center justify-between z-10">
                <h4 class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em] flex items-center gap-2">
                    <i class="fas fa-compass text-emerald-500"></i> Tabla de Contenidos
                </h4>
                <span class="text-[8px] px-2 py-0.5 rounded-full bg-emerald-500/10 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-black uppercase tracking-wider" id="index-counter">0 items</span>
            </div>
            <nav class="px-3 py-4 space-y-1 relative" id="reader-index-nav">
                <div class="text-slate-500 italic text-[11px] p-3 text-center">Cargando índice...</div>
            </nav>
            <!-- Tirador para redimensión -->
            <div id="sidebar-resizer"></div>
        </aside>

        <!-- Contenido Principal (Texto de los Artículos) -->
        <section class="flex-1 overflow-y-auto bg-slate-50/30 dark:bg-transparent relative" id="reader-content-area-scroll">
            <div class="absolute inset-0 bg-gradient-to-br from-emerald-50/30 to-transparent dark:from-emerald-900/10 pointer-events-none -z-10"></div>
            <div class="max-w-4xl mx-auto p-6 md:p-12 space-y-8" id="reader-content-area">
                <div class="flex flex-col items-center justify-center py-32"><div class="w-16 h-16 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin"></div><p class="mt-6 text-sm font-bold text-slate-500 uppercase tracking-widest animate-pulse">Obteniendo ley...</p></div>
            </div>
        </section>
    </div>

    <script src="js/core/security.js"></script>
    <script src="js/core/supabase.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/components.js"></script>
    <script src="js/pages/visor-ley.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof window.injectSharedUI === 'function') {
                window.injectSharedUI('shared-components-root');
            }
        });
    </script>
</body>
</html>
